<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📅 じかんわり メーカー</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Hiragino Maru Gothic Pro', 'Yu Gothic', 'Meiryo', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- importmap: CDNはjsdelivr(安定)を使用 -->
  <script type="importmap">
  {
    "imports": {
      "react":              "https://cdn.jsdelivr.net/npm/react@18.2.0/+esm",
      "react-dom":          "https://cdn.jsdelivr.net/npm/react-dom@18.2.0/+esm",
      "react-dom/client":   "https://cdn.jsdelivr.net/npm/react-dom@18.2.0/client/+esm",
      "react/jsx-runtime":  "https://cdn.jsdelivr.net/npm/react@18.2.0/jsx-runtime/+esm",
      "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
      "firebase/database":  "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"
    }
  }
  </script>

  <!-- アプリ本体 -->
  <script type="module" src="app.js"></script>
</body>
</html>
